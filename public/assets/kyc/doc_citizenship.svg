<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#fcfbf7; font-family:'Mukta', 'Noto Sans Devanagari', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
    <pattern id="guilloche" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 Q 10 0, 20 20 T 40 20" fill="none" stroke="#e8e0cc" stroke-width="0.75" opacity="0.6"/>
      <path d="M 0 20 Q 10 40, 20 20 T 40 20" fill="none" stroke="#e8e0cc" stroke-width="0.75" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Document Paper Base -->
  <rect x="15" y="15" width="970" height="620" rx="8" fill="#fdfbf7" stroke="#d5cbb5" stroke-width="2" filter="url(#shadow)"/>
  <rect x="25" y="25" width="950" height="600" rx="4" fill="url(#guilloche)"/>
  <rect x="35" y="35" width="930" height="580" fill="none" stroke="#8c2828" stroke-width="2.5" stroke-opacity="0.85"/>
  <rect x="42" y="42" width="916" height="566" fill="none" stroke="#8c2828" stroke-width="1" stroke-dasharray="6,3" stroke-opacity="0.6"/>

  <!-- Watermark Text Background -->
  <text x="500" y="360" text-anchor="middle" font-size="75" font-weight="900" fill="#eedbb9" opacity="0.22" transform="rotate(-20 500 360)">नेपाल नागरिकता • DAO DANG</text>

  <!-- Official Header Emblem & Title -->
  <g transform="translate(500, 95)" text-anchor="middle">
    <!-- Nepal Emblem Graphic placeholder -->
    <circle cx="0" cy="-25" r="24" fill="#b91c1c" opacity="0.1"/>
    <path d="M-14,-22 L0,-40 L14,-22 L8,-22 L8,-12 L-8,-12 L-8,-22 Z" fill="#b91c1c"/>
    <circle cx="0" cy="-24" r="5" fill="#fcfbf7"/>
    <text x="0" y="2" font-size="18" font-weight="bold" fill="#8c1d1d">नेपाल सरकार</text>
    <text x="0" y="22" font-size="14" font-weight="semibold" fill="#5c1313">गृह मन्त्रालय</text>
    <text x="0" y="44" font-size="20" font-weight="900" fill="#1e293b" letter-spacing="1">नेपाली नागरिकताको प्रमाणपत्र</text>
    <text x="0" y="64" font-size="13" font-weight="bold" fill="#8c1d1d">जिल्ला प्रशासन कार्यालय, दाङ (Ghorahi, Dang)</text>
  </g>

  <!-- Top Right Certificate Serial & Issue Info -->
  <g transform="translate(730, 75)">
    <rect x="0" y="0" width="200" height="58" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="12" y="20" font-size="11" font-weight="bold" fill="#64748b">प्रमाणपत्र नं. (CERTIFICATE NO):</text>
    <text x="12" y="42" font-size="17" font-weight="bold" font-family="monospace" fill="#0f172a">५२-०१-७२-०४२९१</text>
  </g>

  <!-- Photo Box with Official Embossed Seal -->
  <g transform="translate(740, 160)">
    <rect x="0" y="0" width="180" height="215" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <image href="/assets/kyc/avatar_hari.png" x="8" y="8" width="164" height="199" preserveAspectRatio="xMidYMid slice"/>
    <rect x="0" y="0" width="180" height="215" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <!-- Embossed Red Stamp Overlay -->
    <circle cx="150" cy="185" r="46" fill="#dc2626" fill-opacity="0.18" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,2"/>
    <text x="150" y="180" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">जिल्ला प्रशासन कार्यालय</text>
    <text x="150" y="195" font-size="9" font-weight="bold" fill="#991b1b" text-anchor="middle">दाङ, नेपाल</text>
    <text x="90" y="232" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">हरिप्रसाद चौधरी</text>
  </g>

  <!-- Main Person Details Table / Rows -->
  <g transform="translate(70, 165)" font-size="15" fill="#1e293b">
    <!-- Row 1: Name -->
    <text x="0" y="25" font-weight="bold" fill="#475569">नाम, थर (Full Name):</text>
    <text x="210" y="25" font-weight="bold" font-size="18" fill="#0f172a">हरिप्रसाद चौधरी (Hari Prasad Chaudhary)</text>
    <line x1="205" y1="32" x2="680" y2="32" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Row 2: Birth Date -->
    <text x="0" y="65" font-weight="bold" fill="#475569">जन्म मिति (Date of Birth):</text>
    <text x="210" y="65" font-weight="bold" fill="#0f172a">२०४२ साल भाद्र १४ गते (1985-08-30 A.D.)</text>
    <line x1="205" y1="72" x2="680" y2="72" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Row 3: Birth Place -->
    <text x="0" y="105" font-weight="bold" fill="#475569">जन्मस्थान (Birth Place):</text>
    <text x="210" y="105" font-weight="semibold" fill="#0f172a">गढवा गाउँपालिका वडा नं. ५, चैनपुर, दाङ</text>
    <line x1="205" y1="112" x2="680" y2="112" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Row 4: Permanent Address -->
    <text x="0" y="145" font-weight="bold" fill="#475569">स्थायी ठेगाना (Perm. Address):</text>
    <text x="210" y="145" font-weight="semibold" fill="#0f172a">गढवा गाउँपालिका वडा नं. ५ (साविक चैनपुर गा.वि.स. वडा नं. ३), दाङ</text>
    <line x1="205" y1="152" x2="680" y2="152" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Row 5: Father's Name -->
    <text x="0" y="185" font-weight="bold" fill="#475569">बाबुको नाम (Father's Name):</text>
    <text x="210" y="185" font-weight="semibold" fill="#0f172a">रामबहादुर चौधरी (Ram Bahadur Chaudhary)</text>
    <line x1="205" y1="192" x2="680" y2="192" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Row 6: Mother's Name -->
    <text x="0" y="225" font-weight="bold" fill="#475569">आमाको नाम (Mother's Name):</text>
    <text x="210" y="225" font-weight="semibold" fill="#0f172a">सुमित्रा देवी चौधरी (Sumitra Devi Chaudhary)</text>
    <line x1="205" y1="232" x2="680" y2="232" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Row 7: Citizenship Type -->
    <text x="0" y="265" font-weight="bold" fill="#475569">नागरिकता किसिम (Type):</text>
    <text x="210" y="265" font-weight="bold" fill="#047857">वंशज (By Descent)</text>
    <text x="350" y="265" font-weight="bold" fill="#475569">लिङ्ग (Gender):</text>
    <text x="460" y="265" font-weight="bold" fill="#0f172a">पुरुष (Male)</text>
    <line x1="205" y1="272" x2="680" y2="272" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Bottom Thumbprints Section -->
  <g transform="translate(70, 470)">
    <text x="0" y="0" font-size="13" font-weight="bold" fill="#64748b">औंठाछाप (Thumbprints):</text>
    <!-- Left Thumb -->
    <rect x="0" y="10" width="85" height="95" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="42" cy="55" rx="28" ry="36" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3,1" opacity="0.75"/>
    <ellipse cx="42" cy="55" rx="20" ry="26" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.8"/>
    <text x="42" y="120" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">बायाँ (Left)</text>
    <!-- Right Thumb -->
    <rect x="105" y="10" width="85" height="95" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="147" cy="55" rx="28" ry="36" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-dasharray="3,1" opacity="0.75"/>
    <ellipse cx="147" cy="55" rx="20" ry="26" fill="none" stroke="#1e3a8a" stroke-width="1.5" opacity="0.8"/>
    <text x="147" y="120" font-size="11" font-weight="bold" fill="#64748b" text-anchor="middle">दायाँ (Right)</text>
  </g>

  <!-- Official Round Seal & Issuing Officer Signature -->
  <g transform="translate(420, 485)">
    <!-- Red Seal Stamp -->
    <circle cx="50" cy="50" r="45" fill="#dc2626" fill-opacity="0.1" stroke="#dc2626" stroke-width="2"/>
    <circle cx="50" cy="50" r="40" fill="none" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,2"/>
    <text x="50" y="38" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">जिल्ला प्रशासन कार्यालय</text>
    <text x="50" y="53" font-size="11" font-weight="900" fill="#b91c1c" text-anchor="middle">दाङ, घोराही</text>
    <text x="50" y="68" font-size="9" font-weight="bold" fill="#b91c1c" text-anchor="middle">नेपाल सरकार</text>
  </g>

  <g transform="translate(680, 480)">
    <text x="60" y="15" font-size="12" font-weight="bold" fill="#475569">जारी मिति (Issue Date):</text>
    <text x="60" y="35" font-size="15" font-weight="bold" fill="#0f172a">२०६०/०३/२२ (2003-07-06)</text>
    <!-- Officer Signature Script -->
    <path d="M60,65 Q110,40 140,65 T200,60" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="60" y1="75" x2="230" y2="75" stroke="#94a3b8" stroke-width="1"/>
    <text x="145" y="92" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">प्रशासकीय अधिकृत (Issuing Officer)</text>
    <text x="145" y="108" font-size="10" font-weight="semibold" fill="#64748b" text-anchor="middle">जिल्ला प्रशासन कार्यालय दाङ</text>
  </g>

  <!-- CBS Verified Watermark Pill -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="870" height="26" rx="4" fill="#065f46" fill-opacity="0.08" stroke="#059669" stroke-width="1"/>
    <text x="15" y="18" font-size="11" font-weight="bold" fill="#065f46">UNAKO SACCOS DIGITAL VERIFICATION: CBS TIER-1 ACTIVE • HASH: UKO-2070-08842-CIT-VERIFIED-2080</text>
  </g>
</svg>