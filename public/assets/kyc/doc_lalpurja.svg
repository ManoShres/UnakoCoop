<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" style="background:#fffaf0; font-family:'Mukta', 'Noto Sans Devanagari', sans-serif;">
  <defs>
    <filter id="lshadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Outer Border & Background -->
  <rect x="15" y="15" width="970" height="620" rx="8" fill="#fffdf7" stroke="#c29d59" stroke-width="3" filter="url(#lshadow)"/>
  <rect x="25" y="25" width="950" height="600" rx="4" fill="none" stroke="#8b4513" stroke-width="1.5"/>
  <rect x="33" y="33" width="934" height="584" fill="none" stroke="#c29d59" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Watermark -->
  <text x="500" y="350" text-anchor="middle" font-size="80" font-weight="900" fill="#f5deb3" opacity="0.3" transform="rotate(-15 500 350)">मालपोत कार्यालय लमही, दाङ</text>

  <!-- Header -->
  <g transform="translate(500, 75)" text-anchor="middle">
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#78350f">नेपाल सरकार</text>
    <text x="0" y="20" font-size="14" font-weight="semibold" fill="#92400e">भूमि व्यवस्था, सहकारी तथा गरिबी निवारण मन्त्रालय</text>
    <text x="0" y="44" font-size="22" font-weight="900" fill="#78350f" letter-spacing="1">जग्गाधनी दर्ता प्रमाणपुर्जा</text>
    <text x="0" y="66" font-size="14" font-weight="bold" fill="#1e293b">भूमि सुधार तथा मालपोत कार्यालय, लमही, दाङ</text>
  </g>

  <!-- Top Reference Numbers -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#475569">दर्ता सि.नं. (Reg. No): <tspan fill="#0f172a" font-family="monospace">०२-४१२१८</tspan></text>
    <text x="0" y="22" font-size="14" font-weight="bold" fill="#475569">पुर्जा जारी मिति: <tspan fill="#0f172a">२०७५/०८/१२</tspan></text>
  </g>
  <g transform="translate(730, 130)">
    <!-- Government Revenue Stamp Box -->
    <rect x="0" y="-15" width="200" height="55" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="100" y="5" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">नेपाल सरकार टिकट (REVENUE STAMP)</text>
    <text x="100" y="25" font-size="15" font-weight="900" fill="#b45309" text-anchor="middle">रु. १००/- (STAMPED)</text>
  </g>

  <!-- Land Owner Details Banner -->
  <g transform="translate(60, 190)">
    <rect x="0" y="0" width="880" height="85" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="28" font-size="14" font-weight="bold" fill="#64748b">जग्गाधनीको नाम, थर:</text>
    <text x="170" y="28" font-size="17" font-weight="bold" fill="#0f172a">हरिप्रसाद चौधरी (Hari Prasad Chaudhary)</text>

    <text x="560" y="28" font-size="14" font-weight="bold" fill="#64748b">नागरिकता प्रमाणपत्र नं:</text>
    <text x="730" y="28" font-size="15" font-weight="bold" font-family="monospace" fill="#0f172a">५२-०१-७२-०४२९१</text>

    <text x="20" y="60" font-size="14" font-weight="bold" fill="#64748b">बाबु/पतिको नाम:</text>
    <text x="170" y="60" font-size="15" font-weight="semibold" fill="#0f172a">रामबहादुर चौधरी</text>

    <text x="560" y="60" font-size="14" font-weight="bold" fill="#64748b">बाजे/ससुराको नाम:</text>
    <text x="730" y="60" font-size="15" font-weight="semibold" fill="#0f172a">जगतनारायण चौधरी</text>
  </g>

  <!-- Land Cadastral Details Table -->
  <g transform="translate(60, 300)">
    <text x="0" y="-10" font-size="15" font-weight="bold" fill="#78350f">जग्गाको विस्तृत विवरण (Parcel &amp; Plot Particulars):</text>
    <rect x="0" y="0" width="880" height="175" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Table Header -->
    <rect x="0" y="0" width="880" height="35" rx="6" fill="#f1f5f9"/>
    <line x1="0" y1="35" x2="880" y2="35" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="23" font-size="13" font-weight="bold" fill="#475569">जिल्ला / गा.पा.</text>
    <text x="170" y="23" font-size="13" font-weight="bold" fill="#475569">वडा नं. (साविक)</text>
    <text x="310" y="23" font-size="13" font-weight="bold" fill="#475569">कित्ता नं. (Parcel)</text>
    <text x="470" y="23" font-size="13" font-weight="bold" fill="#475569">क्षेत्रफल (Area)</text>
    <text x="630" y="23" font-size="13" font-weight="bold" fill="#475569">किसिम (Class)</text>
    <text x="760" y="23" font-size="13" font-weight="bold" fill="#475569">कैफियत / धितो</text>

    <!-- Table Row 1 -->
    <text x="20" y="68" font-size="14" font-weight="bold" fill="#0f172a">दाङ, गढवा गा.पा.</text>
    <text x="170" y="68" font-size="14" font-weight="semibold" fill="#0f172a">५ (चैनपुर-३)</text>
    <text x="310" y="68" font-size="18" font-weight="900" font-family="monospace" fill="#b91c1c">४१२</text>
    <text x="470" y="68" font-size="15" font-weight="bold" fill="#047857">०-४-०-० (४ कठ्ठा)</text>
    <text x="630" y="68" font-size="14" font-weight="semibold" fill="#0f172a">अब्बल धनहर (कृषि)</text>
    <text x="760" y="68" font-size="12" font-weight="bold" fill="#b45309">उनको साकोस धितो</text>

    <line x1="0" y1="90" x2="880" y2="90" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Boundary Description -->
    <text x="20" y="118" font-size="13" font-weight="bold" fill="#64748b">चारकिल्ला (Boundaries):</text>
    <text x="20" y="142" font-size="13" font-weight="semibold" fill="#334155">पूर्व: कुलप्रसाद मार्ग (सडक) • पश्चिम: कित्ता नं ४११ • उत्तर: सिँचाइ मुख्य कुलो • दक्षिण: कित्ता नं ४१३</text>
  </g>

  <!-- Official Seals & Land Officer Signature -->
  <g transform="translate(100, 500)">
    <circle cx="50" cy="40" r="38" fill="#dc2626" fill-opacity="0.12" stroke="#dc2626" stroke-width="2"/>
    <text x="50" y="32" font-size="10" font-weight="bold" fill="#991b1b" text-anchor="middle">मालपोत कार्यालय</text>
    <text x="50" y="46" font-size="11" font-weight="900" fill="#991b1b" text-anchor="middle">लमही, दाङ</text>
    <text x="50" y="58" font-size="8" font-weight="bold" fill="#991b1b" text-anchor="middle">मुकाम देउखुरी</text>
  </g>

  <g transform="translate(680, 500)">
    <!-- Land Officer Signature -->
    <path d="M50,30 Q90,5 130,30 T180,25" fill="none" stroke="#0f172a" stroke-width="2"/>
    <line x1="30" y1="45" x2="210" y2="45" stroke="#94a3b8" stroke-width="1"/>
    <text x="120" y="62" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">मालपोत अधिकृत (Land Revenue Officer)</text>
    <text x="120" y="78" font-size="11" font-weight="semibold" fill="#64748b" text-anchor="middle">भूमि सुधार तथा मालपोत कार्यालय, लमही</text>
  </g>

  <!-- Cooperative Mortgage Lien Tag -->
  <g transform="translate(50, 580)">
    <rect x="0" y="0" width="880" height="26" rx="4" fill="#b45309" fill-opacity="0.1" stroke="#b45309" stroke-width="1"/>
    <text x="15" y="18" font-size="11" font-weight="bold" fill="#92400e">MORTGAGE HYPOTHECATION REGISTERED: UNAKO SAVINGS &amp; CREDIT COOPERATIVE LTD. • LOAN SECURITY EVALUATION: NPR 28,50,000/-</text>
  </g>
</svg>